spring.application.name=cursillo-ms-facturas
server.port=8083

spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.shyckraroqegoaxzdmrp
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=none

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# CONFIGURACION DE LOGS
logging.file.name=logs/facturacion.log
logging.level.org.cursillo.facturacion.controller=INFO
logging.level.org.cursillo.facturacion.service=DEBUG
logging.level.org.cursillo.facturacion.repository=DEBUG
logging.level.org.springframework.cache=TRACE
logging.level.org.hibernate.SQL=DEBUG

# CONFIGURACION DE REDIS CACHE
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# TIEMPOS DE VIDA EN MEMORIA (TTL)
cache.ttl.default=10m
cache.ttl.conceptos=1h
cache.ttl.facturas=10m
cache.ttl.detalles-facturas=10m

